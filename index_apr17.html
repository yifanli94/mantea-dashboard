  { rank: 3, name: '古茗',       tag: 'Pingu联名4/16上线，高热度互动', bar: 82 },
  { rank: 4, name: '爷爷不泡茶', tag: '×Dinotaeng联名葡萄系列，61万观看', bar: 75 },
  { rank: 5, name: '霸王茶姬',   tag: '春日意境短片+colorwalk，226万观看', bar: 70 },
  { rank: 6, name: '瑞幸咖啡',   tag: '金烘系列+苦瓜美式，高热度互动', bar: 65 },
];

let current = null;

// Mobile sidebar toggle
function openMenu() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('sidebarOverlay').addEventListener('click', closeMenu);

function renderBrandList() {
  const el = document.getElementById('brandList');
  el.innerHTML = BRANDS.map(b => `
    <div class="brand-item${b.id === current ? ' active' : ''}" onclick="select('${b.id}')">
      <span class="brand-name">${b.name}</span>
      ${b.rank ? `<span class="brand-rank">#${b.rank}</span>` : ''}
    </div>
  `).join('');
}

function renderHot() {
  const el = document.getElementById('hotList');
  el.innerHTML = HOT.map(h => `
    <div class="hot-item">
      <div class="hot-rank">#${h.rank}</div>
      <div class="hot-info">
        <div class="hot-brand">${h.name}</div>
        <div class="hot-tag">${h.tag}</div>
        <div class="hot-bar"><div class="hot-bar-fill" style="width:${h.bar}%"></div></div>
      </div>
    </div>
  `).join('');

  // Mobile: horizontal scroll cards
  const elM = document.getElementById('hotListMobile');
  elM.innerHTML = HOT.map(h => `
    <div class="hot-card">
      <div class="hot-rank">#${h.rank}</div>
      <div class="hot-brand">${h.name}</div>
      <div class="hot-tag">${h.tag}</div>
    </div>
  `).join('');
}

function render(id) {
  const d = DATA[id];
  const brand = BRANDS.find(b => b.id === id);
  if (!d) return;

  const avatar = brand.name.slice(0, 1);

  let sections = '';

  if (d.new && d.new.length > 0) {
    sections += `<div class="section">
      <div class="section-label label-new">🆕 新品</div>
      ${d.new.map(i => `
        <div class="item">
          <div class="item-title">${i.title}</div>
          <div class="item-desc">${i.desc}</div>
          ${i.date ? `<span class="item-date">${i.date}</span>` : ''}
        </div>
      `).join('')}
    </div>`;
  }

  if (d.hot && d.hot.length > 0) {
    sections += `<div class="section">
      <div class="section-label label-hot">🎀 营销/联名</div>
      ${d.hot.map(i => `
        <div class="item">
          <div class="item-title">${i.title}</div>
          <div class="item-desc">${i.desc}</div>
          ${i.date ? `<span class="item-date">${i.date}</span>` : ''}
        </div>
      `).join('')}
    </div>`;
  }

  if (d.event && d.event.length > 0) {
    sections += `<div class="section">
      <div class="section-label label-event">📌 其他动态</div>
      ${d.event.map(i => `
        <div class="item">
          <div class="item-title">${i.title}</div>
          <div class="item-desc">${i.desc}</div>
          ${i.date ? `<span class="item-date">${i.date}</span>` : ''}
        </div>
      `).join('')}
    </div>`;
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="brand-card show">
      <div class="brand-header">
        <div class="brand-avatar">${avatar}</div>
        <div>
          <div class="brand-title">${brand.name}</div>
          ${brand.rank ? `<div class="brand-sub">今日热度 #${brand.rank}</div>` : ''}
        </div>
      </div>
      ${sections}
    </div>
  `;
}

function select(id) {
  current = id;
  renderBrandList();
  render(id);
  if (window.innerWidth <= 768) closeMenu();
}

renderBrandList();
renderHot();
</script>
</body>
</html>
