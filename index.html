<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>茶咖热点追踪看板 by 曼拾</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f0ece8;
      --surface: #faf9f7;
      --surface2: #f5f3f0;
      --border: #e0dbd5;
      --accent: #8b6fd4;
      --accent2: #7c6af7;
      --text: #2a2835;
      --text2: #6b6880;
      --text3: #9994a8;
      --new: #5eb8f3;
      --hot: #e8825e;
      --event: #9b6fd4;
      --welfare: #4db88a;
      --dim: #d4cfca;
    }
    
    html, body {
      height: 100%;
    }
    
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    
    /* ── Header ── */
    header {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(240,236,232,0.96);
      backdrop-filter: blur(12px);
    }
    
    .header-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #8b6fd4, #6b4fba);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      color: white;
      font-weight: 800;
      font-family: 'SF Pro Display', serif;
      letter-spacing: -0.5px;
    }
    
    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    
    .header-sub {
      font-size: 12px;
      color: var(--text3);
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }
    
    .header-spacer { flex: 1; }
    
    .header-meta {
      font-size: 12px;
      color: var(--text3);
    }
    
    .tag-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text2);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
    }
    
    .tag-live .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #6ee7b7;
    }
    
    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 200px 1fr 260px;
      height: calc(100vh - 52px);
    }
    
    /* ── Sidebar ── */
    .sidebar {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 0;
    }
    
    .sidebar-section {
      padding: 0 12px;
      margin-bottom: 8px;
    }
    
    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text2);
      padding: 8px 8px 4px;
    }
    
    .brand-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      gap: 8px;
    }
    
    .brand-item:hover { background: var(--surface2); }
    .brand-item.active { background: var(--surface2); }
    
    .brand-name {
      font-size: 13px;
      font-weight: 500;
      flex: 1;
    }
    
    .brand-rank {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      min-width: 18px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    
    /* ── Main ── */
    .main {
      overflow-y: auto;
      padding: 24px 28px;
    }
    
    .brand-welcome {
      margin-bottom: 28px;
    }
    
    .brand-welcome h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    
    .brand-welcome p {
      font-size: 13px;
      color: var(--text3);
    }
    
    .section {
      margin-bottom: 28px;
    }
    
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .section-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text2);
    }
    
    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    
    .section-count {
      font-size: 11px;
      color: var(--text3);
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 10px;
    }
    
    /* ── Cards Grid ── */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.15s, transform 0.15s;
    }
    
    .card:hover {
      border-color: var(--dim);
      transform: translateY(-1px);
    }
    
    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    
    .card-badge.new { background: rgba(94,184,243,0.12); color: var(--new); }
    .card-badge.hot { background: rgba(240,146,106,0.12); color: var(--hot); }
    .card-badge.event { background: rgba(192,132,252,0.12); color: var(--event); }
    .card-badge.welfare { background: rgba(110,231,183,0.12); color: var(--welfare); }
    
    .card h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      letter-spacing: -0.2px;
    }
    
    .card p {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.55;
    }
    
    .card .date {
      font-size: 11px;
      color: var(--text3);
      margin-top: 8px;
    }
    
    /* ── Right Panel ── */
    .right {
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px 16px;
    }
    
    .right-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    
    .hot-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    
    .hot-item:last-child { border-bottom: none; }
    
    .hot-rank {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      min-width: 22px;
      line-height: 1.2;
    }
    
    .hot-info { flex: 1; }
    
    .hot-brand {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    
    .hot-tag {
      font-size: 11px;
      color: var(--text2);
      line-height: 1.4;
    }
    
    .hot-bar {
      height: 3px;
      background: var(--surface2);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    
    .hot-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--hot);
    }
    
    /* ── Empty ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 12px;
      color: var(--text3);
    }
    
    .empty-icon {
      font-size: 36px;
      opacity: 0.25;
    }
    
    .empty-text {
      font-size: 13px;
    }
    
    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
    
    @media (max-width: 1100px) {
      .right { display: none; }
      .cards { grid-template-columns: 1fr 1fr; }
    }
    
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>

function renderBrandList() {

  el.innerHTML = BRANDS.map(b => `

function renderHot() {

function render(id) {

}

  renderBrandList();
