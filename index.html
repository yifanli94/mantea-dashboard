    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f0ece8;
      --surface: #faf9f7;
      --surface2: #f5f3f0;
      --border: #e0dbd5;
      --accent: #8b6fd4;
      --accent2: #7c6af7;
      --text: #2a2835;
      --text2: #6b6880;
      --text3: #9994a8;
      --new: #5eb8f3;
      --hot: #e8825e;
      --event: #9b6fd4;
      --welfare: #4db88a;
      --dim: #d4cfca;
    }

    html, body { height: 100%; }

    body {
      font-family: 'PingFang SC', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(240,236,232,0.96);
      backdrop-filter: blur(12px);
    }

    .menu-btn {
      display: none;
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .menu-btn:hover { background: var(--surface2); }
    .menu-btn svg { display: block; width: 20px; height: 20px; color: var(--text); }

    .header-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #8b6fd4, #6b4fba);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      color: white;
      font-weight: 800;
      font-family: 'SF Pro Display', serif;
      letter-spacing: -0.5px;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .header-sub {
      font-size: 12px;
      color: var(--text3);
      padding-left: 10px;
      border-left: 1px solid var(--border);
      white-space: nowrap;
    }

    .header-spacer { flex: 1; }

    .header-meta {
      font-size: 12px;
      color: var(--text3);
      white-space: nowrap;
    }

    .tag-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text2);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .tag-live .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #6ee7b7;
    }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 200px 1fr 260px;
      height: calc(100vh - 52px);
    }

    /* ── Sidebar ── */
    .sidebar {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 0;
      position: relative;
      z-index: 150;
    }

    .sidebar-section {
      padding: 0 12px;
      margin-bottom: 8px;
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text2);
      padding: 8px 8px 4px;
    }

    .brand-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      gap: 8px;
    }

    .brand-item:hover { background: var(--surface2); }
    .brand-item.active { background: var(--surface2); }

    .brand-name {
      font-size: 13px;
      font-weight: 500;
      flex: 1;
    }

    .brand-rank {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      min-width: 18px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ── Main ── */
    .main {
      overflow-y: auto;
      padding: 20px 24px;
    }

    .brand-welcome {
      margin-bottom: 24px;
    }

    .brand-welcome h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .brand-welcome p {
      font-size: 12px;
      color: var(--text3);
    }

    .section {
      margin-bottom: 24px;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text2);
      white-space: nowrap;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .section-count {
      font-size: 11px;
      color: var(--text3);
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    /* ── Cards Grid ── */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.15s, transform 0.15s;
    }

    .card:hover {
      border-color: var(--dim);
      transform: translateY(-1px);
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .card-badge.new { background: rgba(94,184,243,0.12); color: var(--new); }
    .card-badge.hot { background: rgba(240,146,106,0.12); color: var(--hot); }
    .card-badge.event { background: rgba(192,132,252,0.12); color: var(--event); }
    .card-badge.welfare { background: rgba(110,231,183,0.12); color: var(--welfare); }

    .card h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      letter-spacing: -0.2px;
    }

    .card p {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.55;
    }

    .card .date {
      font-size: 11px;
      color: var(--text3);
      margin-top: 8px;
    }

    /* ── Right Panel ── */
    .right {
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px 16px;
    }

    .right-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .hot-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .hot-item:last-child { border-bottom: none; }

    .hot-rank {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      min-width: 22px;
      line-height: 1.2;
    }

    .hot-info { flex: 1; }

    .hot-brand {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .hot-tag {
      font-size: 11px;
      color: var(--text2);
      line-height: 1.4;
    }

    .hot-bar {
      height: 3px;
      background: var(--surface2);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .hot-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--hot);
    }

    /* ── Empty ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 12px;
      color: var(--text3);
    }

    .empty-icon {
      font-size: 36px;
      opacity: 0.25;
    }

    .empty-text {
      font-size: 13px;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

    /* ── Mobile: Hamburger Overlay ── */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 140;
    }

    /* ── Responsive ── */
    @media (max-width: 1100px) {
      .right { display: none; }
      .cards { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 768px) {
      .menu-btn { display: flex; align-items: center; justify-content: center; }

      .header-sub { display: none; }
      .header-title { font-size: 13px; }

      .layout {
        display: block;
        height: auto;
      }

      /* Sidebar: slide-in drawer */
      .sidebar {
        position: fixed;
        top: 52px;
        left: 0;
        bottom: 0;
        width: 260px;
        background: var(--bg);
        border-right: 1px solid var(--border);
        transform: translateX(-100%);
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 150;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.open {
        display: block;
      }

      .main {
        padding: 16px 14px;
        min-height: calc(100vh - 52px);
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .brand-welcome h2 {

      }

      .section { margin-bottom: 20px; }

      /* Hot panel becomes a horizontal scroll on mobile */
      .right {
        display: block;
        border-left: none;
        border-top: 1px solid var(--border);
        padding: 16px 14px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .right-title {
        font-size: 11px;
        margin-bottom: 10px;
      }

      .hot-list-mobile {
        display: flex;
        flex-direction: row;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 8px;
        -webkit-overflow-scrolling: touch;
      }

      .hot-list-mobile .hot-card {
        flex-shrink: 0;
        width: 160px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }

      .hot-list-mobile .hot-rank {
        font-size: 16px;
        font-weight: 800;
        color: var(--accent);
        margin-bottom: 6px;
      }

      .hot-list-mobile .hot-brand {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .hot-list-mobile .hot-tag {
        font-size: 11px;
        color: var(--text2);
        line-height: 1.4;
      }

      .hot-list-desktop { display: none; }
    }

    @media (min-width: 769px) {
      .hot-list-mobile { display: none; }
    }
  </style>
</head>

document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('sidebarOverlay').addEventListener('click', closeMenu);

function renderBrandList() {
  const el = document.getElementById('brandList');
  el.innerHTML = BRANDS.map(b => `
    <div class="brand-item${b.id === current ? ' active' : ''}" onclick="select('${b.id}')">
      <span class="brand-name">${b.name}</span>
      ${b.rank ? `<span class="brand-rank">#${b.rank}</span>` : ''}
    </div>
  `).join('');
}

function renderHot() {
  const el = document.getElementById('hotList');
  el.innerHTML = HOT.map(h => `
    <div class="hot-item">
      <div class="hot-rank">#${h.rank}</div>
      <div class="hot-info">
        <div class="hot-brand">${h.name}</div>
        <div class="hot-tag">${h.tag}</div>
        <div class="hot-bar"><div class="hot-bar-fill" style="width:${h.bar}%"></div></div>
      </div>
    </div>
  `).join('');

  // Mobile: horizontal scroll cards
  const elM = document.getElementById('hotListMobile');
  elM.innerHTML = HOT.map(h => `
    <div class="hot-card">
      <div class="hot-rank">#${h.rank}</div>
      <div class="hot-brand">${h.name}</div>
      <div class="hot-tag">${h.tag}</div>
    </div>
  `).join('');
}

function render(id) {
  const d = DATA[id];
  if (!d) return;
  const brand = BRANDS.find(b => b.id === id);

  let html = `
    <div class="brand-welcome">
      <h2>${brand.name}</h2>
      <p>每日热点追踪 · 2026.04.08</p>
    </div>
  `;

  if (d.new && d.new.length) {
    html += `
      <div class="section">
        <div class="section-head">
          <div class="section-title">🆕 新品上市</div>
          <div class="section-line"></div>
          <div class="section-count">${d.new.length}</div>
        </div>
        <div class="cards">
          ${d.new.map(item => `
            <div class="card">
              <span class="card-badge new">new</span>
              <h4>${item.title}</h4>
              <p>${item.desc}</p>
              <div class="date">${item.date}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  if (d.hot && d.hot.length) {
    html += `
      <div class="section">
        <div class="section-head">
          <div class="section-title">IP联名 · 营销</div>
          <div class="section-line"></div>
          <div class="section-count">${d.hot.length}</div>
        </div>
        <div class="cards">
          ${d.hot.map(item => `
            <div class="card">
              <span class="card-badge hot">hot</span>
              <h4>${item.title}</h4>
              <p>${item.desc}</p>
              <div class="date">${item.date}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  document.getElementById('mainContent').innerHTML = html;
  // Close sidebar on mobile after selection
  if (window.innerWidth <= 768) closeMenu();
}

function select(id) {
  current = id;
  renderBrandList();
  render(id);
}

renderBrandList();
renderHot();
</script>
</body>
</html>
