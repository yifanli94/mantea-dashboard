    .sidebar-section { padding: 0 12px; margin-bottom: 8px; }
    .sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); padding: 8px 8px 4px; }

    .section-line { flex: 1; height: 1px; background: var(--border); }
    .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .card-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; margin-bottom: 10px; }

    .card p { font-size: 12px; color: var(--text2); line-height: 1.55; }
    .card .date { font-size: 11px; color: var(--text3); margin-top: 8px; }
    .right { border-left: 1px solid var(--border); overflow-y: auto; padding: 20px 16px; }

    .hot-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }

    .hot-rank { font-size: 13px; font-weight: 800; color: var(--accent); min-width: 22px; line-height: 1.2; }
    .hot-info { flex: 1; }
    .hot-brand { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .hot-tag { font-size: 11px; color: var(--text2); line-height: 1.4; }
    .hot-bar { height: 3px; background: var(--surface2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .hot-bar-fill { height: 100%; border-radius: 2px; background: var(--hot); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 140; }
    .lost-notice { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; color: var(--text3); font-size: 13px; line-height: 1.8; }

      .header-sub { display: none; }
      .header-title { font-size: 13px; }
      .layout { display: block; height: auto; }
      .sidebar { position: fixed; top: 52px; left: 0; bottom: 0; width: 260px; background: var(--bg); border-right: 1px solid var(--border); transform: translateX(-100%); transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1); z-index: 150; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .sidebar.open { transform: translateX(0); }

      .cards { grid-template-columns: 1fr; gap: 8px; }
      .brand-welcome h2 { font-size: 20px; }
      .section { margin-bottom: 20px; }
      .right { display: block; border-left: none; border-top: 1px solid var(--border); padding: 16px 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .hot-list-mobile { display: flex; flex-direction: row; gap: 10px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }

      .hot-list-mobile .hot-rank { font-size: 16px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
      .hot-list-mobile .hot-brand { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
      .hot-list-mobile .hot-tag { font-size: 11px; color: var(--text2); line-height: 1.4; }

  </style>
</head>
